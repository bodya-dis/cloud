<html lang="en">
<head>

<meta name="description" content="Matcha Cloud — strawberry matcha from Japan, 25 flavours. Opening soon on Druzhby Narodov Ul., bld. 23.">
<meta name="theme-color" content="#21380f">
<link rel="preload" as="image" href="img/first2.jpg">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: one fixed 1920×1080 stage per scene, scaled to fit the viewport; scenes travel vertically, the cup lives on its own layer above both. */
:root{
  --cream:#faf5e1;      /* hero paper */
  --mist:#f6f0dc;       /* parallax gap / letterbox tone */
  --ink:#21380f;        /* matcha ink */
  --ink-2:#223810;
  --nav:#292a2d;
  --berry:#fd5767;      /* strawberry headline */
  --night-top:#141f0c;  /* intro letterbox, sampled from the video */
  --night-bot:#404a25;
  --f-display:"Angkor", "Rockwell Extra Bold", Georgia, serif;
  --f-num:"DM Serif Display", Georgia, serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html,body{height:100%;margin:0;background:var(--night-top);overflow:hidden}
/* letterbox outside the 16:9 frame follows the active scene (tweened in script) */
body{font-family:var(--f-body);-webkit-font-smoothing:antialiased}
/* the design frame: always 1920×1080 proportions, scaled uniformly, centred, clipped */
.vp{position:fixed;left:50%;top:50%;width:calc(var(--W,1920px) * var(--s,1));height:calc(var(--H,1080px) * var(--s,1));transform:translate(-50%,-50%);overflow:hidden}
.wrap{position:absolute;inset:0;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:var(--W,1920px);height:var(--H,1080px);transform-origin:0 0;transform:scale(var(--s,1))}
#hero{background:var(--mist);transform:translateY(100%)}
#hero .wrap-in{position:absolute;inset:0}
#intro{background:linear-gradient(var(--night-top),var(--night-bot))}
#cupWrap{pointer-events:none;overflow:visible}
#heroStage,#introStage,#cupStage{overflow:hidden}
/* desktop fill: stage keeps its 1920×1080 design coordinates, shifted so the extra room lies at the sides (--ox)
   or on top (--oy); scenery layers widen proportionally, edge-anchored UI follows the window edges */
html:not(.m) .stage{width:1920px;height:1080px;transform:scale(var(--s,1)) translate(var(--ox,0px),var(--oy,0px));overflow:visible}
html:not(.m) #heroStage,html:not(.m) #introStage,html:not(.m) #cupStage{overflow:visible}
html:not(.m) #intro video,html:not(.m) #intro .plate,html:not(.m) #first,html:not(.m) #seqCv{left:var(--dvx);top:var(--dvy);width:var(--dvw);height:var(--dvh)}
/* taller windows: the sky stays put (it carries the sun and pagoda too); the paper-coloured hero background fills above it */
html:not(.m) #sky img.d,html:not(.m) #mid img,html:not(.m) #front img.d{width:calc(1920px * var(--kx,1));height:auto;margin-left:calc(-1 * var(--ox,0px));max-width:none}
html:not(.m) #pagoda{left:calc(1660px * var(--kx,1) - var(--ox,0px));top:calc(480px + 60px * var(--kx,1))}
html:not(.m) #pagoda img{width:calc(190px * var(--kx,1));height:auto}
html:not(.m) #sun{left:calc(1552px * var(--kx,1) - var(--ox,0px));top:calc(480px + 200px * var(--kx,1))}
html:not(.m) #mist1{left:calc(-200px - var(--ox,0px))}html:not(.m) #mist2{left:calc(900px + var(--ox,0px))}
html:not(.m) .leftfade{left:calc(-1 * var(--ox,0px))}
html:not(.m) #logo{left:calc(49px - var(--ox,0px));top:calc(20px - var(--oy,0px))}
html:not(.m) #nav{top:calc(32px - var(--oy,0px))}
html:not(.m) #topR{left:calc(1656px + var(--ox,0px));top:calc(22px - var(--oy,0px))}
html:not(.m) #info{left:calc(1651px + var(--ox,0px))}
html:not(.m) #roofG{left:calc(-1 * var(--ox,0px))}
html:not(.m) #bl{left:calc(49px - var(--ox,0px))}
html:not(.m) #stoneG{left:calc(687px + var(--ox,0px))}
html:not(.m) #cupBox{left:calc(996px + var(--ox,0px))}
html:not(.m) #shadow{left:calc(1242px + var(--ox,0px))}

/* intro */
#intro video,#intro .plate,#first,#seqCv{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:fill;display:block}
#intro .plate{opacity:0}
#seqCv{opacity:0}
#introIn{position:absolute;inset:0;transform-origin:50% 40%}
#intro .vignette{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(8,14,4,.45));pointer-events:none}

/* hero layers (stage px) */
.L{position:absolute;left:0;will-change:transform}
.L img{display:block}
/* stage art is sized in stage px on purpose: opt out of the page-wide img{max-width:100%} rule,
   which otherwise caps the full-bleed landscape at its container width and leaves a gap at the right */
.stage img{max-width:none}
#sky{top:0}
#mid{top:480px}
#pagoda{left:1660px;top:540px}
#front{top:840px}
#sun{position:absolute;left:1552px;top:680px;width:0;height:0}
#sun i{position:absolute;left:-260px;top:-260px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,196,186,.55) 0%,rgba(255,214,200,.28) 30%,rgba(255,230,214,0) 62%);opacity:0}
.mist{position:absolute;top:640px;height:300px;width:1400px;opacity:0;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%,rgba(252,249,238,.85),rgba(252,249,238,0) 70%);filter:blur(6px)}
#mist1{left:-200px}#mist2{left:900px;top:720px;width:1200px;height:240px}
.leftfade{position:absolute;left:0;top:0;width:561px;height:1080px;background:linear-gradient(to right,#f7f1dc,rgba(247,241,220,0))}

#matchaMask{position:absolute;left:894px;top:126px;overflow:hidden;padding:0 30px 40px 0;clip-path:inset(0 0 0 0)}
#matcha{margin:0;font:400 250px/0.86 var(--f-display);letter-spacing:-20px;color:var(--ink-2);text-transform:lowercase;white-space:nowrap}
#matchaIn{position:relative}
/* liquid fill: a copy of the word whose background (wave + body in the word's own colour) is clipped to the glyphs */
.liq{position:absolute;padding:40px 30px 40px 0;white-space:nowrap;pointer-events:none;display:none;
  color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-repeat:repeat-x}
#matchaLiquid{left:0;top:-40px;font:400 250px/0.86 var(--f-display);letter-spacing:-20px;text-transform:lowercase}
#cloudG{position:absolute;left:174px;top:254px}
#cloudG .cm-crisp{position:relative;padding:80px}
#cloudWord{margin:0;font:400 264px/0.86 var(--f-display);letter-spacing:-21.12px;color:var(--berry);white-space:nowrap}
#cloudMorph{position:absolute;left:-10px;top:-10px;width:931px;height:408px;pointer-events:none;visibility:hidden}
#cloudWord .wl{display:inline-block;transform-origin:50% 62%;will-change:transform}

#stoneG{position:absolute;left:687px;top:669px;width:1233px;height:411px;transform-origin:50% 100%}
#stoneG img{position:absolute;display:block}
#stone{left:0;top:0;width:1233px;height:411px}
#leaves{left:711px;top:97px;transform-origin:80px 166px}
#leaf2{left:992px;top:295px;transform-origin:14px 40px}
#stoneSheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.0;
  background:linear-gradient(100deg,transparent 35%,rgba(255,255,240,.9) 50%,transparent 65%) no-repeat;background-size:40% 100%;background-position:-60% 0;
  -webkit-mask:url(img/stone.webp) 0 0/100% 100% no-repeat;mask:url(img/stone.webp) 0 0/100% 100% no-repeat}

.ui{position:absolute}
#nav{left:575px;top:32px;display:flex;gap:78px;align-items:center;font:500 20px/0.86 var(--f-body);letter-spacing:-1.6px;text-transform:uppercase;color:var(--nav)}
#nav a,#cart{color:inherit;text-decoration:none}
#loc{left:573px;top:269px;width:292px;display:flex;flex-direction:column;gap:8px;color:var(--ink);font-size:20px;line-height:.9;letter-spacing:-1.2px;text-transform:uppercase;white-space:nowrap}
#loc b{font:400 20px/.9 var(--f-display);letter-spacing:-1.2px}
#loc span{font-weight:500}
#topR{left:1656px;top:22px;display:flex;gap:40px;align-items:center}
#cart{font:500 20px/.86 var(--f-body);letter-spacing:-1.6px;text-transform:uppercase;color:var(--nav);white-space:nowrap}
.soc{display:flex;gap:6px}
.soc a{width:45px;height:45px;border-radius:22.5px;background:var(--ink);display:flex;align-items:center;justify-content:center}
#info{left:1651px;top:487px;width:219px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font:500 20px/.9 var(--f-body);letter-spacing:-1.2px;text-transform:uppercase;color:var(--ink);white-space:nowrap}
#bl{left:49px;top:702px;width:409px;display:flex;flex-direction:column;gap:46px;align-items:flex-start}
#soon{margin:0;font:400 32px/.86 var(--f-display);letter-spacing:-2.56px;color:var(--ink);text-transform:lowercase}
#count{display:flex;gap:28px;align-items:center;color:var(--ink)}
.cu{display:flex;flex-direction:column;gap:14px;align-items:center;text-transform:lowercase;line-height:.86}
.cu .n{font:400 56px/.86 var(--f-num);letter-spacing:-4.48px;text-align:center;font-variant-numeric:tabular-nums}
.cu .u{font:300 32px/.86 var(--f-body);letter-spacing:-2.56px;white-space:nowrap}
.cu:first-child .u{align-self:stretch}
.div{width:1px;height:41px;background:var(--ink);transform-origin:50% 50%}
#btn{position:relative;box-sizing:border-box;width:409px;height:73px;border-radius:100px;background:var(--ink);border:2px solid var(--ink);
  display:flex;gap:211px;align-items:center;justify-content:center;padding:12px;color:#fff;text-decoration:none;
  font:500 20px/1.45 var(--f-body);letter-spacing:-2px;text-transform:uppercase;white-space:nowrap;clip-path:inset(0 0 0 0 round 100px)}
#btn:focus-visible,#nav a:focus-visible,.soc a:focus-visible{outline:3px solid var(--berry);outline-offset:4px}
#btn svg{display:block;width:40px;height:40px}
#roofG{position:absolute;left:0;top:67px;width:675px;height:747px}
#roof{position:absolute;left:0;top:0;display:block}
#lantern{position:absolute;left:92.5px;top:314.9px;width:111.1px;height:257px;transform-origin:50% 0}
#lantern img{width:100%;height:100%;display:block}
#lanternGlow{position:absolute;left:-80px;top:40px;width:270px;height:220px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,214,150,.38),rgba(255,214,150,0));pointer-events:none}
#logo{left:49px;top:20px;display:flex;align-items:flex-start;gap:6px;text-decoration:none}
#logo svg{display:block;width:41px;height:42px}
#logo span{font:400 28px/.86 var(--f-display);letter-spacing:-2.24px;color:var(--ink);margin-top:10px;text-transform:lowercase}

/* cup */
#cupBox{position:absolute;left:996px;top:341px;width:489px;height:733px;transform-origin:0 0;opacity:0;will-change:transform;z-index:2}
.leaf{position:absolute;left:0;top:0;display:block;opacity:0;pointer-events:none;will-change:transform;transform-origin:50% 50%;margin:0;max-width:none}
#leafA{width:120px;height:102px;margin:-51px 0 0 -60px}#leafB{width:96px;height:67px;margin:-33px 0 0 -48px}#leafC{width:84px;height:106px;margin:-53px 0 0 -42px}
#cupIn{position:absolute;inset:0;transform-origin:50% 90.7%}
#cupIn img{position:absolute;inset:0;width:100%;height:100%;display:block}
.cupFx{position:absolute;inset:0;pointer-events:none;
  -webkit-mask:url(img/cup.webp) 0 0/100% 100% no-repeat;mask:url(img/cup.webp) 0 0/100% 100% no-repeat}
#cupSheen{mix-blend-mode:screen;opacity:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%) no-repeat;background-size:60% 100%;background-position:-120% 0}
.drop{position:absolute;width:7px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95) 0 18%,rgba(255,255,255,.25) 40%,rgba(30,60,20,.18) 75%,transparent 80%);opacity:0}
#shadow{position:absolute;left:1242px;top:1001px;width:0;height:0;opacity:0}
#shadow i{position:absolute;border-radius:50%}
#shadow .s1{left:-170px;top:-20px;width:340px;height:40px;background:radial-gradient(closest-side,rgba(28,36,14,.42),rgba(28,36,14,0));filter:blur(4px)}
#shadow .s2{left:-108px;top:-7px;width:216px;height:14px;background:radial-gradient(closest-side,rgba(20,26,10,.55),rgba(20,26,10,0))}

/* ===== mobile (portrait) composition: 940px-wide stage from the mobile reference =====
   --dy = extra stage height on phones taller than 940×1672; the lower group is anchored to the bottom */
.mo{display:none}
html.m .d{display:none}
html.m .mo{display:block}
.L img.mo,#stoneG img.mo{display:none}
html.m .L img.mo,html.m #stoneG img.mo{display:block}
html.m .L img.d,html.m #stone,html.m #leaves,html.m #leaf2{display:none}
html.m #hero{background:#f4edd9}
html.m .stage{width:940px;transform:scale(var(--s,1)) translateX(var(--dx,0px))}
html.m #heroStage,html.m #introStage,html.m #cupStage{overflow:visible}
html.m #sky img.mo,html.m #front img.mo{width:calc(var(--W) + 48px);height:auto;margin-left:calc(-1 * var(--dx,0px) - 24px)}
html.m #heroShade{left:calc(-1 * var(--dx,0px) - 24px);right:calc(-1 * var(--dx,0px) - 24px)}
html.m #mid,html.m #pagoda,html.m #nav,html.m #topR{display:none}
html.m #sky{top:var(--dy)}
html.m #front{top:calc(1080px + var(--dy))}
html.m #sun{left:703px;top:calc(760px + var(--dy))}
html.m #sun i{left:-200px;top:-200px;width:400px;height:400px}
html.m #mist1{left:-320px;top:calc(1010px + var(--dy));width:1000px;height:240px}
html.m #mist2{left:330px;top:calc(1110px + var(--dy));width:900px;height:200px}
/* mobile intro: the portrait landscape is its own layer; the cup film sits on it where the colours match
   (its dark top and misty floor line up with the background) and its edges are feathered into it */
/* mobile intro background (supplied artwork): its own full-bleed layer, scaled with cover and re-anchored per aspect */
#introBg{position:absolute;left:calc(-1 * var(--dx,0px) - 24px);right:calc(-1 * var(--dx,0px) - 24px);top:-2px;bottom:-2px;
  background:#1f3013 url(img/mIntroBg2.webp) no-repeat;background-size:cover;background-position:50% var(--bgy,40%)}
/* phones: the intro is the cut-out cup sequence (transparent frames) floating over the background —
   the film itself, with its baked-in floor, is not used on mobile */
html.m #intro video,html.m #first,html.m #intro .plate{display:none}
html.m #seqCv{left:var(--cx);top:var(--cy);width:var(--cw);height:var(--ch)}
html.m #intro .vignette{background:radial-gradient(130% 80% at 50% 40%,transparent 60%,rgba(8,14,4,.35))}
/* header */
html.m #logo{left:calc(var(--gx) + env(safe-area-inset-left,0px) / var(--s) - var(--dx,0px));top:calc(var(--gt) + env(safe-area-inset-top,0px) / var(--s));gap:10px}
html.m #logo svg{width:56px;height:57px}
html.m #logo span{font-size:44px;letter-spacing:-3.5px;margin-top:14px}
#burger{right:50px;top:46px;left:auto;width:52px;height:34px;padding:0;border:0;background:none;cursor:pointer;flex-direction:column;justify-content:space-between}
html.m #burger{display:flex;right:calc(var(--gx) + env(safe-area-inset-right,0px) / var(--s) - var(--dx,0px));top:calc(var(--gt) + env(safe-area-inset-top,0px) / var(--s) + 12px)}
#burger i{display:block;height:4px;border-radius:2px;background:var(--ink)}
#burger:focus-visible{outline:3px solid var(--berry);outline-offset:6px}
/* roof + lantern (same asset, 0.87×) */
#roofS{position:absolute;inset:0;transform-origin:0 0}
html.m #roofG{left:-38px;top:4px}
html.m #roofS{transform:scale(.87)}
/* headlines: same elements, scaled as a whole so their animations stay exact; more air roof→matcha→cloud */
html.m #matchaMask{left:160px;top:calc(322px + var(--ty));transform:scale(.72);transform-origin:0 0}
html.m #cloudG{left:110px;top:calc(420px + var(--ty));transform:scale(.72);transform-origin:0 0}
html.m #loc{left:168px;top:calc(648px + var(--ty));width:auto;gap:9px}
html.m #loc b{font-size:27px;letter-spacing:-1.4px}
html.m #loc span{font-size:26px;letter-spacing:-1.3px}
html.m #info{left:auto;right:calc(var(--gx) + env(safe-area-inset-right,0px) / var(--s) - var(--dx,0px));top:calc(196px + var(--ty) * .5);width:auto;font-size:26px;gap:10px;text-shadow:0 0 10px rgba(246,240,222,.95),0 0 3px rgba(246,240,222,.9)}
/* stone, bowl, cup */
html.m #stoneG{left:10px;top:calc(1150px + var(--dy));width:1150px;height:575px}
html.m #stoneM{left:0;top:0;width:1150px;height:575px}
#stoneShade{display:none!important;position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(26,22,12,0) 26%,rgba(26,22,12,.5) 52%,rgba(18,15,8,.74) 100%);
  -webkit-mask:url(img/mStone.webp) 0 0/100% 100% no-repeat;mask:url(img/mStone.webp) 0 0/100% 100% no-repeat}
html.m #bowlM{left:525px;top:-91px;width:456px;height:304px}
html.m #stoneSheen{-webkit-mask-image:url(img/mStone.webp);mask-image:url(img/mStone.webp)}
html.m #cupBox{left:253px;top:calc(719px + var(--dy));width:435px;height:652px}
html.m #shadow{left:472px;top:calc(1305px + var(--dy))}
html.m #shadow .s1{left:-150px;top:-17px;width:300px;height:34px}
html.m #shadow .s2{left:-96px;top:-6px;width:192px;height:12px}
/* readability: a soft dark gradient over the lower part of the hero only (separate layer, image untouched) */
#heroShade{position:absolute;left:0;right:0;top:calc(1250px + var(--dy));height:560px;pointer-events:none;
  background:radial-gradient(ellipse 66% 52% at 50% 52%,rgba(16,14,8,.6) 0%,rgba(16,14,8,.44) 42%,rgba(16,14,8,.16) 74%,rgba(16,14,8,0) 100%)}
html.m #soon,html.m .cu{text-shadow:0 1px 14px rgba(10,10,5,.35)}
/* countdown + CTA, centred on the stone */
html.m #bl{left:0;width:940px;top:calc(1350px + var(--dy));align-items:center;gap:24px;--paper:#f6efda}
html.m #soon{font-size:46px;letter-spacing:-3.4px;color:var(--paper)}
html.m #count{gap:38px;color:var(--paper)}
html.m .cu{gap:14px}
html.m .cu .n{font-size:62px;letter-spacing:-4.6px}
html.m .cu .u{font-size:36px;letter-spacing:-2.6px}
html.m .div{background:var(--paper);height:52px}
html.m #btn{width:586px;height:100px;border-color:#efe7cf;gap:0;font-size:30px;letter-spacing:-1.8px}
html.m #btn svg{position:absolute;right:40px;top:50%;width:52px;height:52px;margin-top:-26px}
/* soft out-of-focus tea leaves framing the bottom corners (same leaf cut-outs) */
.fgLeaf{position:absolute;pointer-events:none;filter:blur(5px)}
html.m #fgL1{left:-80px;top:calc(1415px + var(--dy));width:250px;height:315px;transform:rotate(28deg)}
html.m #fgL2{left:745px;top:calc(1500px + var(--dy));width:290px;height:247px;transform:rotate(196deg);filter:blur(6px)}

#replay{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;
  width:40px;height:40px;border-radius:20px;border:1px solid rgba(33,56,15,.35);background:rgba(250,245,225,.8);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
#replay.on{opacity:.75;pointer-events:auto}#replay:hover{opacity:1}
#replay:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
#tap[hidden]{display:none}
#tap span{padding:12px 22px;border-radius:999px;background:rgba(20,30,12,.55);border:1px solid rgba(243,236,210,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#tap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;padding-bottom:calc(14vh + env(safe-area-inset-bottom,0px));justify-content:center;background:transparent;border:0;color:#f3ecd2;
  font:500 15px var(--f-body);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}

/* ===== interactive states ===== */
:root{--matcha:#5f8a2a;--matcha-hi:#7da33a;--ease-out:cubic-bezier(.22,.8,.24,1)}
/* nav + cart: underline draws in from the left, out to the right */
#nav a,#cart{position:relative;transition:color .3s var(--ease-out)}
#nav a::after,#cart::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:2px;border-radius:1px;background:var(--matcha);
  transform:scaleX(0);transform-origin:100% 50%;transition:transform .45s var(--ease-out)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  /* Some embedded previews deliver no animation frames even while the page is visible. Detect it and
     drive GSAP (and the intro frame player) from a timer instead, so the sequence always completes. */
  let rafAlive = false, lastRaf = performance.now();
  (function beat(){ requestAnimationFrame(() => { rafAlive = true; lastRaf = performance.now(); beat(); }); })();
  // keep real time even when frames arrive late (throttled previews): no lag smoothing, so the intro → hero hand-off never creeps
  gsap.ticker.lagSmoothing(0);
  let usingRaf = true;
  setInterval(() => {                              // GSAP 3: tick the clock by hand while animation frames are stalled
    usingRaf = performance.now() - lastRaf <= 400;
    if (!usingRaf && window.gsap) gsap.ticker.tick();
  }, 33);
  const nextFrame = fn => (performance.now() - lastRaf > 400) ? setTimeout(() => fn(performance.now()), 33) : requestAnimationFrame(fn);
  const vid = $('#vid'), hero = $('#hero'), intro = $('#intro');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- fit the 1920×1080 stages ---------- */
  function fit(){
    const r = document.documentElement;          // usable area (excludes the page's safe-area padding)
    // real layout size of the page; the visual viewport only refines the height when it is valid and smaller
    // (Safari's toolbars). Embedded frames can report 0×0 while loading — never lay out from that.
    const vv = window.visualViewport;
    const w = Math.round(r.clientWidth || window.innerWidth);
    let h = Math.round(window.innerHeight || r.clientHeight);
    if (vv && vv.height > 50 && vv.height < h) h = Math.round(vv.height);
    if (!(w > 50 && h > 50)) { requestAnimationFrame(fit); setTimeout(fit, 120); return; }
    const m = w / h < .8;                          // portrait screens use the mobile composition
    r.classList.toggle('m', m);
    let s, W, H, dx = 0;
    let ox = 0, oy = 0;
    if (!m) {   // desktop fills the window: never stretched — the scene gains width (wide screens) or height (tall ones)
      if (w / h >= 1920 / 1080) { s = h / 1080; ox = (w / s - 1920) / 2; }
      else { s = w / 1920; oy = h / s - 1080; }
      W = 1920 + 2 * ox; H = 1080 + oy;
    }
    else {
      // phones always fill the screen: full width; taller screens get extra stage height, shorter ones
      // (e.g. Safari with its toolbars showing) get extra width on both sides — no empty bands either way
      s = w / 940; H = Math.round(h / s); W = 940;
      if (H < 1672) { s = h / 1672; H = 1672; W = w / s; dx = (W - 940) / 2; }
    }
    if (!m) vid.preload = 'auto';
    // mobile: the film box is sized and placed on its own over the portrait background layer —
    // cup ≈ 55% of the width, centred at 44% of the height, ingredient ring kept fully on screen
    // phones: the cup sequence is sized from the screen *width* (cup ≈ 49% of it, ingredient ring fully on screen) and
    // centred vertically in the open sky; the background is laid out independently (cover + per-aspect anchor)
    const vw = m ? 1720 : 1920, vh = vw * 1080 / 1920;
    const vx = m ? (940 - vw) / 2 : 0, vy = m ? .45 * H - 590 * (vw / 1920) : 0;
    r.style.setProperty('--s', s); r.style.setProperty('--W', W + 'px'); r.style.setProperty('--H', H + 'px');
    r.style.setProperty('--dy', (m ? H - 1672 : 0) + 'px');
    r.style.setProperty('--ty', (m ? Math.round((H - 1672) * .32) : 0) + 'px');   // part of the extra height opens up the headline block
    r.style.setProperty('--vw', vw + 'px'); r.style.setProperty('--vh', vh + 'px');
    r.style.setProperty('--vx', vx + 'px'); r.style.setProperty('--vy', vy + 'px');
    r.style.setProperty('--dx', dx + 'px');
    r.style.setProperty('--ox', ox + 'px'); r.style.setProperty('--oy', oy + 'px'); r.style.setProperty('--kx', 1 + 2 * ox / 1920);
    // desktop film covers the whole window (centred crop), same box for film, plate and first frame
    const kv = Math.max(W / 1920, H / 1080), dvw = 1920 * kv, dvh = 1080 * kv;
    const dvx = -ox + (W - dvw) / 2, dvy = -oy + (H - dvh) / 2;
    r.style.setProperty('--dvx', dvx + 'px'); r.style.setProperty('--dvy', dvy + 'px');
    r.style.setProperty('--dvw', dvw + 'px'); r.style.setProperty('--dvh', dvh + 'px');
    // phone frames cover film x 340–1580 and extend 640 film px above the film's top edge (the poured stream)
    const kf = vw / 1920;
    r.style.setProperty('--cx', (vx + 340 * kf) + 'px'); r.style.setProperty('--cw', (1240 * kf) + 'px');
    r.style.setProperty('--cy', (vy - 640 * kf) + 'px'); r.style.setProperty('--ch', (1720 * kf) + 'px');
    // shared gutter for the mobile header (≈24–30 css px, wider phones get a little more), in stage units
    const gut = Math.max(22, Math.min(30, w * .068));
    r.style.setProperty('--gx', (gut / s) + 'px'); r.style.setProperty('--gt', (16 / s) + 'px');
    r.style.setProperty('--bgy', (m ? Math.max(30, Math.min(55, 40 + (H / 1672 - 1) * 40)) : 40) + '%');
    LAYOUT = { m, W, H, dx, dy: m ? H - 1672 : 0, k: vw / 1920, vx, vy, ox, oy, kv, dvx, dvy };
  }
  let LAYOUT = {};
  addEventListener('resize', fit); addEventListener('orientationchange', fit);
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(document.documentElement);
  fit();

  /* ---------- geometry (stage px) ---------- */
  // cup as it stands at the end of the video, measured on the last frame
  // the cup as it stands at the end of the video (measured on the last frame, video px), relative to its final box
  const CUP_FS = .85, CUP_FM = 1.18;   // final cup scale (desktop / phone): the drink is the hero next to the title
  function cup0(){
    if (!LAYOUT.m) { const kv = LAYOUT.kv, l = 606*kv + LAYOUT.dvx, t = 70*kv + LAYOUT.dvy;
      return { x: l - (1035 + LAYOUT.ox), y: t - 437, s: 683*kv/489 }; }
    // measured fit of the hero cup image to the film's last frame: 693.2 px wide at (607.4, 69.4) film px
    const k = LAYOUT.k, l = 607.4*k + LAYOUT.vx, t = 69.4*k + LAYOUT.vy;
    return { x: l - 215, y: t - (613 + LAYOUT.dy), s: 693.2*k / 435 };
  }

  /* ---------- headline liquid textures ----------
     A 420px-wide wave tile; below the crest the body fades from a slightly lighter
     shade of the word's colour to the exact colour within 70px, then stays exact. */
  function liquid(light, exact, crest, back){
    const svg = (d, body) => 'url("data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns='http://www.w3.org/2000/svg' width='420' height='760' viewBox='0 0 420 760'>${d}${body}</svg>`) + '")';
    const wave = 'M0 16C70 9 140 9 210 16S350 23 420 16';
    const front = svg(`<defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='86' gradientUnits='userSpaceOnUse'><stop offset='0' stop-color='${light}'/><stop offset='1' stop-color='${exact}'/></linearGradient></defs>`,
      `<path d='${wave}V760H0Z' fill='url(#g)'/><path d='${wave}' fill='none' stroke='${crest}' stroke-width='2.5' stroke-opacity='.7'/>`);
    const rear = svg('', `<path d='M0 16C70 23 140 23 210 16S350 9 420 16V760H0Z' fill='${back}' fill-opacity='.55'/>`);
    return front + ',' + rear;
  }
  const mL = document.getElementById('matchaLiquid');
  const ENTRANCE_LIQ = liquid('#33501c', '#223810', '#47672b', '#2b4515');
  mL.style.backgroundImage = ENTRANCE_LIQ;
  mL.style.backgroundSize = '420px 760px, 420px 760px';

  /* ---------- CLOUD · soft wave ----------
     Letters are wrapped only while the wave runs (glyph positions are identical with or
     without the wrappers), then the plain word is restored. */
  const cloudWord = document.getElementById('cloudWord');
  function splitCloud(){
    if (cloudWord.querySelector('.wl')) return;
    cloudWord.innerHTML = [...cloudWord.textContent].map(c => `<span class="wl">${c}</span>`).join('');
  }
  function unsplitCloud(){ if (cloudWord.querySelector('.wl')) cloudWord.textContent = cloudWord.textContent; }
  /* ---------- CLOUD · cloud-to-type morph ----------
     Each letter of "cloud" was pre-rendered (from the exact glyph) as 30 frames: soft cumulus
     puffs shaped like the letter billow in, contract onto the contour, and the solid pink grows
     outward from inside the strokes until it fills the exact glyph. Frames play on one canvas
     over the word (neighbouring frames blended for smoothness); the last frame is identical to
     the live text, which takes over the instant the morph ends. */
  const CM = {"n": 30, "cols": 6, "letters": [{"x": 54, "y": 102, "w": 229, "h": 232}, {"x": 197, "y": 41, "w": 194, "h": 290}, {"x": 300, "y": 102, "w": 245, "h": 232}, {"x": 453, "y": 102, "w": 271, "h": 232}, {"x": 632, "y": 41, "w": 266, "h": 293}]};
  const cmCanvas = document.getElementById('cloudMorph'), cmCtx = cmCanvas.getContext('2d');
  const cmImgs = [0,1,2,3,4].map(i => document.getElementById('cm' + i));
  const CM_DUR = 1.15, CM_STAG = .075;               // per letter; C → L → O → U → D  (≈1.45 s total)
  function drawMorph(t){
    cmCtx.clearRect(0, 0, cmCanvas.width, cmCanvas.height);
    CM.letters.forEach((L, i) => {
      const pr = Math.min(1, Math.max(0, (t - i*CM_STAG) / CM_DUR)) * (CM.n - 1);
      const f0 = Math.floor(pr), f1 = Math.min(CM.n - 1, f0 + 1), mix = pr - f0;
      const blit = (f, a) => { if (a <= 0) return; cmCtx.globalAlpha = a;
        cmCtx.drawImage(cmImgs[i], (f % CM.cols)*L.w, Math.floor(f / CM.cols)*L.h, L.w, L.h, L.x, L.y, L.w, L.h); };
      blit(f0, 1 - mix); blit(f1, mix);
    });
    cmCtx.globalAlpha = 1;
  }
  function cloudMorph(){
    const st = { t: 0 }, total = CM_DUR + 4*CM_STAG;
    return gsap.timeline()
      .set(cmCanvas, { visibility: 'visible' })
      .fromTo(st, { t: 0 }, { t: total, duration: total, ease: 'none', onUpdate: () => drawMorph(st.t), onStart: () => drawMorph(0) })
      .set('#cloudWord', { opacity: 1 })
      .set(cmCanvas, { visibility: 'hidden' });
  }

  /* ---------- tea leaves ----------
     Three leaves cut from the supplied photo travel on smooth Catmull-Rom paths (stage px,
     leaf centre). While a leaf is between "back" indices it passes behind the glass. */
  const LEAVES = [
    { id: 'leafA', at: 0,   dur: 7.0, rot: [-18, 205], flip: 1.9,
      pts: [[1565,460],[1500,418],[1330,396],[1160,428],[1022,598],[978,705],[1012,825],[962,960],[996,1170]], back: [1, 4] },
    { id: 'leafC', at: .55, dur: 6.6, rot: [8, 150],  flip: 2.4,
      pts: [[1474,566],[1532,502],[1604,562],[1560,650],[1484,704],[1532,806],[1490,930],[1544,1170]], back: [9, 9] },
    { id: 'leafB', at: 1.1, dur: 7.8, rot: [34, -160], flip: 1.6,
      pts: [[1002,705],[1040,642],[1200,612],[1402,640],[1502,700],[1560,640],[1610,722],[1560,862],[1622,1000],[1584,1170]], back: [1, 4] }
  ];
  const cr = (p0, p1, p2, p3, t) => {
    const t2 = t*t, t3 = t2*t;
    return .5*((2*p1) + (-p0+p2)*t + (2*p0-5*p1+4*p2-p3)*t2 + (-p0+3*p1-3*p2+p3)*t3);
  };
  function along(pts, u){
    const n = pts.length - 1, f = Math.min(u*n, n - 1e-6), i = Math.floor(f), t = f - i;
    const P = k => pts[Math.max(0, Math.min(n, k))];
    return { x: cr(P(i-1)[0], P(i)[0], P(i+1)[0], P(i+2)[0], t), y: cr(P(i-1)[1], P(i)[1], P(i+1)[1], P(i+2)[1], t), seg: i };
  }
  let skipLeaves = false;
  function hideLeaves(){ LEAVES.forEach(L => gsap.set('#'+L.id, { opacity: 0, x: -400, y: -400 })); }
  function startLeaves(){
    LEAVES.forEach(L => {
      const el = document.getElementById(L.id), st = { u: 0 };
      const pts = !LAYOUT.m ? L.pts.map(([x, y]) => [x + LAYOUT.ox, y]) : L.pts.map(([x, y], j, a) =>
        [(x - 1242)*.89 + 472, j === a.length - 1 ? LAYOUT.H + 130 : (y - 1001)*.89 + 1306 + LAYOUT.dy]);
      gsap.to(el, { opacity: 1, duration: .9, ease: 'sine.out', delay: L.at });
      gsap.to(st, { u: 1, duration: L.dur, delay: L.at, ease: 'sine.in',
        onUpdate(){
          const q = along(pts, st.u), k = st.u * L.dur;
          el.style.zIndex = (q.seg >= L.back[0] && q.seg < L.back[1]) ? 1 : 3;
          gsap.set(el, { x: q.x, y: q.y,
            rotation: L.rot[0] + (L.rot[1]-L.rot[0])*st.u + 6*Math.sin(k*1.7),
            scaleY: .78 + .22*Math.cos(k*L.flip) });          // gentle tumble, like a leaf turning in air
        } });
    });
  }

  /* ---------- condensation droplets ---------- */
  const drops = $('#drops');
  const dropEls = [];
  [[118,330],[372,300],[402,420],[96,520],[350,560],[140,250],[330,250],[250,600]].forEach(([x,y])=>{
    const d = document.createElement('i'); d.className='drop';
    d.style.left = x+'px'; d.style.top = y+'px'; drops.appendChild(d); dropEls.push(d);
  });

  /* ---------- lantern: damped pendulum that never fully stops ---------- */
  const lantern = $('#lantern');
  let swingT0 = null;
  function swing(){
    if (swingT0 === null) return;

    const rg = g.createRadialGradient(hs/2 - 3, hs/2 - 4, 1, hs/2, hs/2, 9);
    rg.addColorStop(0, '#a7c75e'); rg.addColorStop(.55, '#6f9a33'); rg.addColorStop(1, 'rgba(63,95,24,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(hs/2, hs/2, 9, 0, 7); g.fill();
    for (let i = 0; i < 140; i++){ const a = Math.random() * 7, r = Math.sqrt(Math.random()) * 9;
      g.fillStyle = COLS[(Math.random() * COLS.length) | 0]; g.globalAlpha = .55 + Math.random() * .45;
      g.fillRect(hs/2 + Math.cos(a) * r, hs/2 + Math.sin(a) * r, .9, .9); }
  })();

  let last = performance.now(), ring = 0, press = 0;
  function frame(now){
    const dt = Math.min(48, now - last); last = now;
    ctx.clearRect(0, 0, W, H);
    // powder specks
    for (let i = P.length - 1; i >= 0; i--){
      const p = P[i]; p.life += dt;
      if (p.life > p.max){ P.splice(i, 1); continue; }
      p.vx *= .985; p.vy = p.vy * .985 + p.g * dt / 16; p.x += p.vx * dt / 16; p.y += p.vy * dt / 16;
      const k = 1 - p.life / p.max;
      ctx.globalAlpha = Math.min(1, k * 1.6) * .9; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (.6 + .4 * k), 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // cursor head
    if (fine.matches && seen){
      cx += (mx - cx) * Math.min(1, dt / 40); cy += (my - cy) * Math.min(1, dt / 40);
      ring += (overT - ring) * Math.min(1, dt / 90); press += (down - press) * Math.min(1, dt / 60);
      const sc = (1 - ring * .45) * (1 - press * .25);
      ctx.save(); ctx.globalAlpha = 1 - ring * .35;
      ctx.drawImage(head, mx - hs/2 * sc, my - hs/2 * sc, hs * sc, hs * sc); ctx.restore();
      if (ring > .02){   // dusty ring that opens around links and buttons
        const R = 6 + ring * 18 - press * 4;
        ctx.save(); ctx.globalAlpha = ring * .85; ctx.strokeStyle = '#6f9a33'; ctx.lineWidth = 1.4;
        ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.stroke(); ctx.restore();
      }
      // a few grains always fall from the mound, even when it rests
      if (!still && Math.random() < dt / 120) spawn(mx, my + 3, 1, 6, .15);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const sync = () => document.documentElement.classList.toggle('pc', fine.matches);
  fine.addEventListener ? fine.addEventListener('change', sync) : 0; sync();
})();
</script>


<script>
/* Live countdown: odometer digits + divider "fill" showing progress to the next unit change. */
(() => {
  const OPEN_AT = Date.parse('2026-11-08T17:00:00Z');   // opening: 8 Nov 2026, 19:00 Kyiv
  const els = {}; document.querySelectorAll('.cu .n').forEach(n => {
    els[n.dataset.k] = n;
    n.setAttribute('aria-live','off');
    n.innerHTML = '<span class="dg"><span class="col">'+[...Array(10).keys()].map(d=>'<i>'+d+'</i>').join('')+'</span></span>'
                + '<span class="dg"><span class="col">'+[...Array(10).keys()].map(d=>'<i>'+d+'</i>').join('')+'</span></span>';
  });
  const divs = document.querySelectorAll('#count .div');   // [days|hours] fills by minutes, [hours|minutes] fills by seconds
  const left = () => Math.max(0, OPEN_AT - Date.now());
  const parts = ms => { const s = Math.floor(ms/1000); return { d: Math.min(99, Math.floor(s/86400)), h: Math.floor(s%86400/3600), m: Math.floor(s%3600/60), s: s%60 }; };
  const pad = v => String(v).padStart(2,'0');
  let shown = null, live = false;
  function setDigits(k, v, dur, delay){
    const cols = els[k].querySelectorAll('.col'); const t = pad(v);
    cols.forEach((c, i) => {
      const y = -(+t[i]) + 'em';
      if (window.gsap && dur) gsap.to(c, { y, duration: dur, delay: (delay||0) + i*.08, ease: dur > .8 ? 'expo.out' : 'back.out(1.6)' });
      else c.style.transform = 'translateY(' + y + ')';
    });
    els[k].setAttribute('aria-label', t);
  }
  function update(){
    const p = parts(left());
    if (live) ['d','h','m'].forEach(k => { if (!shown || shown[k] !== p[k]) setDigits(k, p[k], .7); });
    if (divs[1]) divs[1].style.setProperty('--p', ((p.s ? 60 - p.s : 0) / 60).toFixed(3));
    if (divs[0]) divs[0].style.setProperty('--p', ((60 - p.m) % 60 / 60).toFixed(3));
    if (live && shown && shown.m !== p.m && divs[1]) { divs[1].classList.remove('tick'); void divs[1].offsetWidth; divs[1].classList.add('tick'); }
    if (live) shown = p;
  }
  ['d','h','m'].forEach(k => setDigits(k, 0));
  window.cdRollIn = () => {                    // slot-machine entrance: each unit spins up to the real value
    const p = parts(left()); ['d','h','m'].forEach(k => setDigits(k, 0));
    ['d','h','m'].forEach((k, i) => setDigits(k, p[k], 1.4 + i*.25, .05 + i*.12));
    shown = p; live = true;
  };
  update(); setInterval(update, 1000);
  if (location.hash === '#final') setTimeout(() => { if (!live) window.cdRollIn(); }, 50);
})();
</script>
